name: Check streams
on:
  schedule: [{ cron: '0 */3 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Download program guides (optional, set the EPG_SITES repo variable)
        env: { EPG_SITES: '${{ vars.EPG_SITES }}' }
        run: |
          [ -z "$EPG_SITES" ] && exit 0
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git /tmp/epg
          cd /tmp/epg && npm install --silent
          timeout 20m npm run grab --- --sites="$EPG_SITES" --output="$GITHUB_WORKSPACE/guides/{site}.xml" || true
      - run: node scripts/healthcheck.mjs
      - run: |
          git config user.name "stream-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A data thumbs
          git diff --cached --quiet || (git commit -m "Update stream status" && git push)
