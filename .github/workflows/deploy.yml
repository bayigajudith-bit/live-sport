name: Check streams and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Program guides (optional)
        if: github.event_name != 'push'
        env:
          EPG_SITES: ${{ vars.EPG_SITES }}
        run: |
          [ -z "$EPG_SITES" ] && exit 0
          git clone --depth 1 -b master https://github.com/iptv-org/epg.git /tmp/epg
          cd /tmp/epg && npm install --silent
          timeout 20m npm run grab --- --sites="$EPG_SITES" --output="$GITHUB_WORKSPACE/guides/{site}.xml" || true

      - name: Check streams
        if: github.event_name != 'push'
        run: |
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          node scripts/healthcheck.mjs
          mkdir -p public/data public/thumbs
          touch public/thumbs/.gitkeep
          git config user.name "stream-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A -f public
          git diff --cached --quiet || (git commit -m "Update stream status" && git push)

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
